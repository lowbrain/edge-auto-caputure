[capture]
# Edge を起動したデバッグポート（IPv4を明示）
cdp_url = http://127.0.0.1:9222

# Edge を起動したときに最初に開くページ（空なら about:blank）
# ※ start_edge_debug.ps1 / run.bat 経由で起動するときに使われる
# 例: https://example.com  /  https://www.google.com
start_url = https://www.google.com

# 保存先フォルダ（png も txt もここ）
output_dir = output

# URL変化を確認する間隔（秒）
poll_interval = 1.0

# 変化検知後、描画が落ち着くまで待つ秒数
settle_delay = 0.8

# ページ読み込み待ちの上限（ミリ秒）
load_timeout = 5000

# 撮らないURL（カンマ区切り。空URLは常に自動スキップ）
skip_urls = about:blank

# 一部抜き出しの CSS セレクタ（空なら一部抜きはスキップ）
# 例: h1  /  article  /  .price  /  #main .title
target_selector =
