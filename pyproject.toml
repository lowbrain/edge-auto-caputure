[project]
name = "edge-auto-capture"
# バージョンの出所は infra.__version__ に一本化する（D-B1）。ここに直書きすると
# コードと二重管理になり、片方だけ上げる事故が起きるため dynamic で参照する。
dynamic = ["version"]
description = "Edge の URL/タブ変化ごとにスクショと全文テキストを自動保存するツール"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
]
# 配布ビルドの再現性のためバージョンを縛る（「先月は動いたのに今月は動かない」を防ぐ）。
#   >=1.60 : 動作確認済みの版（.venv 実測）。これ未満は未検証なので許可しない。
#   <2     : メジャー更新（API 総入れ替えの恐れ）へ自動で飛び移らせない。
# 厳密な1点固定は互換範囲の宣言を潰すためここには書かない。必要なら constraints で行う。
dependencies = [
    "playwright>=1.60,<2",
]

[project.optional-dependencies]
# 配布用 exe をビルドする人向け（配布物の実行には不要）。
build = ["pyinstaller"]
# 開発・テスト用（配布物の実行には不要）。
#   pip install -e ".[dev]"  で入れて、pytest / ruff / mypy を使う。
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 役割ごとに分割したトップレベル・モジュール群（パッケージフォルダは作らない）。
# ページ側 JS 本体は badge.js（データファイル）で、配布 exe には build.ps1 が同梱する。
py-modules = ["edge_auto_capture", "badge", "capture", "config", "infra"]

[tool.setuptools.dynamic]
# バージョンは infra.__version__ を出所にする（project.dynamic と対）。
version = { attr = "infra.__version__" }

[tool.pytest.ini_options]
# テストは tests/ 配下。実 Edge を要するスモーク（smoke_*）は既定の収集から外し、
# 速い純粋関数テスト（test_*）だけを既定で回す（smoke は明示指定で実行）。
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
# 型チェッカー（mypy）。注釈はほぼ完備で playwright は py.typed 同梱の
# ため、既定（非 strict）でも実効性がある。回帰は CI で pytest/ruff と同列に止める想定。
#   mypy edge_auto_capture.py badge.py capture.py config.py infra.py
# 新しい mypy（2.3+）は 3.9 ターゲットを廃止したため 3.10 で型検査する。
# 実行時は requires-python=">=3.9" のまま（3.9 実機で動く）。3.10 検査だと `X | Y` など
# 3.10 専用構文を mypy が見逃す点だけ注意（実際に使わない運用で担保。書いてよいのは
# PEP 585 の dict[]/list[] までで X|Y は使わない — HANDOFF「落とし穴」参照）。
python_version = "3.10"
# 生成物やテスト（smoke は実 Edge 前提でスタブ化が重い）は対象外。まずは配布コード本体を守る。
files = ["edge_auto_capture.py", "badge.py", "capture.py", "config.py", "infra.py"]
exclude = ["build", "dist", "output", "tests"]
# 注釈漏れの新規混入を防ぐ最低限。既存はほぼ注釈済みで、これで追加負担はほぼ無い。
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
# 対象は分割した3モジュールとテスト。生成物（build/dist/output）は除外。
target-version = "py39"
# 日本語コメント主体で、ruff は全角文字を表示幅2カラムで数える（E501 が当たりやすい）。
# コードの実体より余裕を持たせ、コメント行が幅超過で頻繁に引っかからないよう 120 にする。
line-length = 120
extend-exclude = ["build", "dist", "output"]

[tool.ruff.lint]
# E/F=pyflakes+pycodestyle, I=import順, UP=旧構文の近代化, B=bugbear（バグになりやすい書き方）。
select = ["E", "F", "I", "UP", "B"]
# 意図的に例外を握り潰す箇所が多い（堅牢性のための設計）ため、B の一部は許容する。
# E501（行長）は line-length に従う。necessary な握り潰しは各所コメントで説明済み。
ignore = ["B008"]
