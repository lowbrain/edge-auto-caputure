[project]
name = "edge-auto-capture"
# バージョンの出所は infra.__version__ に一本化する（D-B1）。ここに直書きすると
# コードと二重管理になり、片方だけ上げる事故が起きるため dynamic で参照する。
dynamic = ["version"]
description = "Edge の URL/タブ変化ごとにスクショと全文テキストを自動保存するツール"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
]
# 配布ビルドの再現性のためバージョンを縛る（ROADMAP 第3群「依存の未ピン留め」）。
#   >=1.60 : 動作確認済みの版（.venv 実測）。これ未満は未検証なので許可しない。
#   <2     : メジャー更新（API 総入れ替えの恐れ）へ自動で飛び移らせない。
# 厳密な1点固定は互換範囲の宣言を潰すためここには書かない。必要なら constraints で行う。
dependencies = [
    "playwright>=1.60,<2",
]

[project.optional-dependencies]
# 配布用 exe をビルドする人向け（配布物の実行には不要）。
build = ["pyinstaller"]
# 開発・テスト用（配布物の実行には不要）。
#   pip install -e ".[dev]"  で入れて、pytest / ruff を使う。
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 役割ごとに分割したトップレベル・モジュール群（パッケージフォルダは作らない）。
# ページ側 JS 本体は badge.js（データファイル）で、配布 exe には build.ps1 が同梱する。
py-modules = ["edge_auto_capture", "badge", "capture", "config", "infra"]

[tool.setuptools.dynamic]
# バージョンは infra.__version__ を出所にする（project.dynamic と対）。
version = { attr = "infra.__version__" }

[tool.pytest.ini_options]
# テストは tests/ 配下。実 Edge を要するスモーク（smoke_*）は既定の収集から外し、
# 速い純粋関数テスト（test_*）だけを既定で回す（smoke は明示指定で実行）。
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
# 対象は分割した3モジュールとテスト。生成物（build/dist/output）は除外。
target-version = "py39"
# 日本語コメント主体で、ruff は全角文字を表示幅2カラムで数える（E501 が当たりやすい）。
# コードの実体より余裕を持たせ、コメント行が幅超過で頻繁に引っかからないよう 120 にする。
line-length = 120
extend-exclude = ["build", "dist", "output"]

[tool.ruff.lint]
# E/F=pyflakes+pycodestyle, I=import順, UP=旧構文の近代化, B=bugbear（バグになりやすい書き方）。
select = ["E", "F", "I", "UP", "B"]
# 意図的に例外を握り潰す箇所が多い（堅牢性のための設計）ため、B の一部は許容する。
# E501（行長）は line-length に従う。necessary な握り潰しは各所コメントで説明済み。
ignore = ["B008"]
